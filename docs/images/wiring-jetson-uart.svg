<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1120" height="600" fill="#ffffff"/>
<text x="560" y="40" font-size="23" text-anchor="middle" fill="#222" font-weight="bold">Alternative: Jetson 40-pin header UART direct (works, but marginal)</text>
<text x="560" y="64" font-size="13" text-anchor="middle" fill="#c62828" font-weight="normal">Jetson Orin Nano: pins 8/10 = /dev/ttyTHS1, 3.3 V logic. Prefer the USB-TTL adapter.</text>
<rect x="40" y="100" width="220" height="300" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="150.0" y="128" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Jetson</text>
<text x="150.0" y="147" font-size="12" text-anchor="middle" fill="#444" font-weight="normal">40-pin header (3.3 V)</text>
<rect x="860" y="100" width="220" height="300" rx="10" fill="#f3f3f3" stroke="#424242" stroke-width="2"/>
<text x="970.0" y="128" font-size="17" text-anchor="middle" fill="#222" font-weight="bold">Roomba 500</text>
<text x="970.0" y="147" font-size="12" text-anchor="middle" fill="#444" font-weight="normal">7-pin Mini-DIN port</text>
<text x="245" y="185" font-size="14" text-anchor="end" fill="#222" font-weight="normal">Pin 8 · TXD</text>
<circle cx="260" cy="180" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="245" y="265" font-size="14" text-anchor="end" fill="#222" font-weight="normal">Pin 10 · RXD</text>
<circle cx="260" cy="260" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="245" y="365" font-size="14" text-anchor="end" fill="#222" font-weight="normal">Pin 6 · GND</text>
<circle cx="260" cy="360" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="875" y="185" font-size="14" text-anchor="start" fill="#222" font-weight="normal">Pin 3 · RXD</text>
<circle cx="860" cy="180" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="875" y="265" font-size="14" text-anchor="start" fill="#222" font-weight="normal">Pin 4 · TXD</text>
<circle cx="860" cy="260" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="875" y="365" font-size="14" text-anchor="start" fill="#222" font-weight="normal">Pin 6 · GND</text>
<circle cx="860" cy="360" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
<path d="M260 180 H860" fill="none" stroke="#1e63d6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="560" y="170" font-size="12" text-anchor="middle" fill="#1e63d6" font-weight="bold">Jetson TX ⟶ Roomba RX (3.3 V into a 5 V input: marginal)</text>
<path d="M260 260 H860" fill="none" stroke="#2e9e44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="680" y="250" font-size="12" text-anchor="middle" fill="#2e9e44" font-weight="bold">Roomba TX (5 V, ~1 kΩ internal) ⟶ Jetson RX</text>
<path d="M470 260 V282" fill="none" stroke="#2e9e44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M470 332 V360" fill="none" stroke="#222222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="457" y="282" width="26" height="50" rx="3" fill="#fff8e1" stroke="#333" stroke-width="2"/>
<text x="490" y="305" font-size="13" text-anchor="start" fill="#222" font-weight="bold">R 2 kΩ</text>
<text x="490" y="321" font-size="11" text-anchor="start" fill="#555" font-weight="normal">pin 10 → GND</text>
<path d="M260 360 H860" fill="none" stroke="#222222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="680" y="350" font-size="12" text-anchor="middle" fill="#222222" font-weight="bold">common ground</text>
<circle cx="470" cy="260" r="6" fill="#222222"/>
<circle cx="470" cy="360" r="6" fill="#222222"/>
<rect x="872" y="410" width="196" height="70" rx="6" fill="#ffebee" stroke="#d32f2f" stroke-width="1.5"/>
<text x="970.0" y="434" font-size="14" text-anchor="middle" fill="#c62828" font-weight="bold">⚠ Pins 1 &amp; 2 = Vpwr</text>
<text x="970.0" y="452" font-size="12" text-anchor="middle" fill="#c62828" font-weight="normal">raw battery, ~14–17 V</text>
<text x="970.0" y="470" font-size="13" text-anchor="middle" fill="#c62828" font-weight="bold">DO NOT CONNECT</text>
<text x="45" y="500" font-size="12.5" text-anchor="start" fill="#333" font-weight="normal">• The Roomba's TX has roughly 1 kΩ of output resistance, so 2 kΩ to ground divides 5 V down to ~3.3 V (measured 5.0 V → 3.7 V at 3 kΩ load).</text>
<text x="45" y="520" font-size="12.5" text-anchor="start" fill="#333" font-weight="normal">• Jetson TX at 3.3 V is only just above the Roomba's input threshold. It needed bytes spaced ~10 ms apart and 2 stop bits, and still occasionally garbled.</text>
<text x="45" y="540" font-size="12.5" text-anchor="start" fill="#333" font-weight="normal">• A BSS138 4-channel level shifter did NOT work between the Jetson header and the Roomba: lines sat at 1.5–2 V. The same shifter works fine with an ESP32.</text>
<text x="45" y="560" font-size="12.5" text-anchor="start" fill="#333" font-weight="normal">• Avoid baud rates ≤ 1200 on the Tegra UART: they wedged /dev/ttyTHS1 until a reboot.</text>
<text x="45" y="580" font-size="12.5" text-anchor="start" fill="#333" font-weight="normal">• Garbled bytes can turn into real commands; a corrupted byte once started a cleaning cycle. Lift the robot when testing this setup.</text>
</svg>
